<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Usman Shawls Centre — Gallery</title>
	<meta name="description" content="Usman Shawls Centre Gallery page" />
	<link rel="stylesheet" href="../assets/css/styles.css" />
	<style>
		.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
		.gallery img{width:100%;height:200px;object-fit:cover;border-radius:12px;border:1px solid #e6eaef;background:#fff}
		@media (max-width: 800px){.gallery{grid-template-columns:1fr}}
	</style>
</head>
<body>
	<header class="site-header"></header>
	<main class="container" style="padding:32px 0;">
		<h1>Gallery</h1>
		<p>A glimpse of our shawls and stoles. Replace with your own images.</p>
		<div class="gallery">
			<img src="../assets/images/og-image.jpg" alt="Sample 1" />
			<img src="../assets/images/og-image.jpg" alt="Sample 2" />
			<img src="../assets/images/og-image.jpg" alt="Sample 3" />
			<img src="../assets/images/og-image.jpg" alt="Sample 4" />
			<img src="../assets/images/og-image.jpg" alt="Sample 5" />
			<img src="../assets/images/og-image.jpg" alt="Sample 6" />
		</div>
	</main>
	<footer class="site-footer"></footer>
	<script src="../assets/js/main.js"></script>
</body>
</html>
