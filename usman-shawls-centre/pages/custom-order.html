<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Usman Shawls Centre — Custom Order</title>
	<meta name="description" content="Usman Shawls Centre Custom Order page" />
	<link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
	<header class="site-header"></header>
	<main class="container" style="padding:32px 0;">
		<h1>Custom Order</h1>
		<p>Tell us your preferred material, size, and embroidery style.</p>
		<form class="card" style="display:grid;gap:12px;max-width:560px;">
			<label>Full Name<br/><input type="text" placeholder="Your Name" style="width:100%;padding:10px;border:1px solid #e6eaef;border-radius:10px" /></label>
			<label>Email<br/><input type="email" placeholder="you@example.com" style="width:100%;padding:10px;border:1px solid #e6eaef;border-radius:10px" /></label>
			<label>Material<br/>
				<select style="width:100%;padding:10px;border:1px solid #e6eaef;border-radius:10px">
					<option>Pashmina</option>
					<option>Wool</option>
					<option>Cashmere Blend</option>
				</select>
			</label>
			<label>Details<br/>
				<textarea rows="5" placeholder="Embroidery, color, size..." style="width:100%;padding:10px;border:1px solid #e6eaef;border-radius:10px"></textarea>
			</label>
			<button class="btn primary" type="submit">Submit Request</button>
		</form>
	</main>
	<footer class="site-footer"></footer>
	<script src="../assets/js/main.js"></script>
</body>
</html>
