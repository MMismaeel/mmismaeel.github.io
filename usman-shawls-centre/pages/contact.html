<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Usman Shawls Centre — Contact</title>
	<meta name="description" content="Usman Shawls Centre Contact page" />
	<link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
	<header class="site-header"></header>
	<main class="container" style="padding:32px 0;">
		<h1>Contact</h1>
		<div class="grid" style="grid-template-columns:1fr 1fr;gap:20px">
			<form class="card" style="display:grid;gap:12px;">
				<label>Name<br/><input type="text" placeholder="Your Name" style="width:100%;padding:10px;border:1px solid #e6eaef;border-radius:10px" /></label>
				<label>Email<br/><input type="email" placeholder="you@example.com" style="width:100%;padding:10px;border:1px solid #e6eaef;border-radius:10px" /></label>
				<label>Message<br/>
					<textarea rows="6" placeholder="How can we help?" style="width:100%;padding:10px;border:1px solid #e6eaef;border-radius:10px"></textarea>
				</label>
				<button class="btn primary" type="submit">Send</button>
			</form>
			<div class="card">
				<strong>Usman Shawls Centre</strong>
				<p>Address line 1<br/>City, Country</p>
				<p><a href="mailto:info@example.com">info@example.com</a><br/>+00 123 456 789</p>
			</div>
		</div>
	</main>
	<footer class="site-footer"></footer>
	<script src="../assets/js/main.js"></script>
</body>
</html>
